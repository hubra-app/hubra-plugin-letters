id: letters
name: Letters
version: "1.1.0"
hubra: ">=0.2.6,<1"
description: "Serial letters for members without e-mail: written in Hubra, printed as one PDF for window envelopes, or sent by post through Pingen."
author: Hubra
homepage: https://github.com/hubra-app/hubra-plugin-letters
license: AGPL-3.0-or-later
tags: [letters, post, print, pdf, pingen]
package: hubra_letters
modules: [letters]
requires: [members]
migrations: migrations
frontend: frontend/dist/plugin.js
# The areas this plugin extends; Hubra refuses a plugin that touches one it
# doesn't list. See docs/plugins.md in hubra-app/hubra.
uses: [routes, tables, settings, jobs, nav, frontend, contracts]
